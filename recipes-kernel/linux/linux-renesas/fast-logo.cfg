# ============================================================
# RZ/G3L seamless boot logo - required kernel configuration
# ============================================================
#
# DESIGN.md rule R7, "Let nothing else draw".
#
# The hand-over the fast-logo patches implement is one-shot: the DU, DSI, VSP
# and ADV7535 drivers each skip their destructive setup for exactly one modeset
# and behave normally afterwards. That only produces a seamless boot if the
# first DRM commit is the one that carries real content - i.e. Weston's.
#
# The BSP defconfig sets CONFIG_FB=y and CONFIG_LOGO=y. CONFIG_FB=y makes
# CONFIG_DRM_FBDEV_EMULATION default to y, which in turn enables
# CONFIG_FRAMEBUFFER_CONSOLE. With fbcon present, register_framebuffer() from
# rzg2l_du_probe() -> drm_fbdev_dma_setup() reaches drm_fb_helper_set_par(),
# which commits an all-black fbdev framebuffer. That commit
#
#   1. paints black over the picture U-Boot left on the screen, and
#   2. consumes all four one-shot hand-over guards before Weston ever runs,
#
# so the boot logo is lost no matter what the rest of the layer does.
#
# Dropping fbdev emulation removes that first commit entirely: without fbcon
# nobody calls set_par(), and the first commit then comes from Weston, whose
# framebuffer already contains real content. It also frees the framebuffer
# fbdev would otherwise pin in CMA for the lifetime of the system.
#
# Weston's DRM backend does not use /dev/fb0, and core-image-weston pulls in no
# other fbdev client (no psplash), so nothing in the image regresses. If you add
# a userspace component that needs /dev/fb0, re-enable DRM_FBDEV_EMULATION but
# keep FRAMEBUFFER_CONSOLE off - fbcon is the part that issues the modeset.
#
# CONFIG_FB itself is deliberately left as the BSP has it: turning it off is an
# image-size optimisation that first needs a check that no enabled driver
# selects it.

# CONFIG_DRM_FBDEV_EMULATION is not set
# CONFIG_FRAMEBUFFER_CONSOLE is not set
# CONFIG_FRAMEBUFFER_CONSOLE_DETECT_PRIMARY is not set

# No kernel logo either - it is drawn by fbcon, and it would be drawn over the
# U-Boot image.
# CONFIG_LOGO is not set
# CONFIG_LOGO_LINUX_CLUT224 is not set

# CONFIG_SND is not set                                                                                                                                                                                                                
# CONFIG_PCI is not set                                                                                                                                                                                                                
# CONFIG_VIDEO_RZG2L_CSI2 is not set                                                                                                                                                                                                   
# CONFIG_VIDEO_RZG2L_CRU is not set
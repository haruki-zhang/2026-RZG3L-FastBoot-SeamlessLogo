# RZ/G3L (smarc-rzg3l, linux-renesas 6.12) fast-boot kernel fragment
#
# Two kinds of entry. The negatives remove boot work or boot *objects*; the
# positives at the bottom assert what must survive, so a defconfig change
# cannot quietly take the display or the boot storage away.
#
# Do not spell out a symbol assigned in this file in the prose: merge_config.sh
# resolves each symbol with "grep -w" over the whole fragment, so a comment
# mentioning one makes it report a bogus "value is redefined".

# ---- Image size / init work with no DT node behind it ----
# CONFIG_BTRFS_FS is not set
# CONFIG_VIRTUALIZATION is not set
# CONFIG_EFI is not set
# CONFIG_NEW_LEDS is not set
# CONFIG_MODULE_UNLOAD is not set

# ---- PCIe ----
# CONFIG_PCI is not set

# ---- Ethernet (G3L GbE is dwmac; the Renesas MACs have no node here) ----
# CONFIG_STMMAC_ETH is not set
# CONFIG_NET_VENDOR_RENESAS is not set

# ---- CAN, audio, camera (cascade to their subsystems) ----
# CONFIG_CAN is not set
# CONFIG_SND is not set
# CONFIG_VIDEO_RZG2L_CRU is not set
# CONFIG_VIDEO_RZG2L_CSI2 is not set

# ---- PWM / MTU3 ----
# CONFIG_PWM_RZG2L_GPT is not set
# CONFIG_PWM_RZ_MTU3 is not set
# CONFIG_RZ_MTU3 is not set

# ---- Peripheral SPI masters (no enabled node; RPCIF for xspi/NOR is kept) ----
# CONFIG_SPI_RSPI is not set
# CONFIG_SPI_RSPI_V2H is not set
# CONFIG_SPI_SH_MSIOF is not set
# CONFIG_SPI_RZV2M_CSI is not set

# ---- Thermal drivers with no matching node (the G3L tsu uses RZG3S) ----
# CONFIG_RZG2L_THERMAL is not set
# CONFIG_RCAR_THERMAL is not set
# CONFIG_RCAR_GEN3_THERMAL is not set

# ---- RTC driver (rtc/vbattb are disabled in the DT) ----
# CONFIG_RTC_DRV_RENESAS_RTCA3 is not set

# ---- Legacy BSD pseudo-terminals ----
# 256 pairs, two systemd device units each: 512 units nothing will ever open,
# 81% of the boot transaction, walked serially for 1114 ms between
# "everything weston needs is ready" and "weston is allowed to start". The
# UNIX98 interface below is what all current userspace uses.
# CONFIG_LEGACY_PTYS is not set

# ---- Wireless ----
# rz-vlp-fast drops wifi/bluetooth from DISTRO_FEATURES but the kernel still
# built cfg80211/mac80211 in, and rfkill added two more device units. WLAN has
# to be the symbol disabled: drivers/net/wireless/Kconfig does "select
# WIRELESS" and WLAN is default y, so turning off WIRELESS alone is silently
# reverted by kconfig.
# CONFIG_WLAN is not set
# CONFIG_WIRELESS is not set
# CONFIG_RFKILL is not set

# ---- KASLR ----
# The boot log shows "KASLR disabled due to lack of seed" on every boot, so the
# relocation pass is pure cost. Re-enable only if KASLR is a product
# requirement, and only once U-Boot publishes /chosen/rng-seed.
# CONFIG_RANDOMIZE_BASE is not set

# ---- Must survive ----
CONFIG_UNIX98_PTYS=y
CONFIG_MEDIA_SUPPORT=y
CONFIG_VIDEO_DEV=y
CONFIG_V4L_PLATFORM_DRIVERS=y
CONFIG_VIDEO_RENESAS_VSP1=y
CONFIG_VIDEO_RENESAS_FCP=y
CONFIG_IIO=y
CONFIG_RZG2L_ADC=y
CONFIG_RZG3S_THERMAL=y
CONFIG_THERMAL=y
CONFIG_THERMAL_OF=y
CONFIG_DRM=y
CONFIG_DRM_RZG2L_DU=y
CONFIG_DRM_RZG2L_MIPI_DSI=y
CONFIG_DRM_I2C_ADV7511=y
CONFIG_SPI=y
CONFIG_SPI_RPCIF=y
CONFIG_MTD=y
CONFIG_MTD_SPI_NOR=y
CONFIG_MMC_SDHI=y
CONFIG_EXT4_FS=y
CONFIG_NET=y
CONFIG_SERIAL_SH_SCI=y
CONFIG_SERIAL_SH_SCI_CONSOLE=y

# Left exactly as the BSP has it, so a graphics overlay such as
# meta-rzg3l-fast-logo can turn the framebuffer console and the kernel logo off
# without a conflicting assignment in this fragment.
CONFIG_FB=y

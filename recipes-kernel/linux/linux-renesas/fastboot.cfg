# ============================================================
# RZ/G3L (smarc-rzg3l / linux-renesas 6.12) fast-boot kernel config fragment
# ============================================================

# ---- Remove non-DT-gated boot work / shrink the Image ----
# CONFIG_BTRFS_FS is not set
# CONFIG_VIRTUALIZATION is not set
# CONFIG_EFI is not set
# CONFIG_NEW_LEDS is not set
# CONFIG_MODULE_UNLOAD is not set

# ---- PCIe (remove PCI subsystem init, relatively high value) ----
# CONFIG_PCI is not set

# ---- Ethernet (G3L GbE is actually STMMAC/dwmac; RAVB/SH_ETH/RSWITCH unused; keep NET core) ----
# CONFIG_STMMAC_ETH is not set
# CONFIG_NET_VENDOR_RENESAS is not set

# ---- CAN (cascades CAN_RCAR_CANFD and FLEXCAN/M_CAN/MCP251XFD) ----
# CONFIG_CAN is not set

# ---- Audio (cascades SND_SOC/RZ/PDM/DA7213/HDMI_CODEC/SIMPLE_CARD/AUDIO_GRAPH_CARD) ----
# CONFIG_SND is not set

# ---- Camera (disable only CRU/CSI2; keep MEDIA_SUPPORT/VSP1/FCP for display) ----
# CONFIG_VIDEO_RZG2L_CRU is not set
# CONFIG_VIDEO_RZG2L_CSI2 is not set

# ---- PWM / MTU3 (DT already disables gpt/poegd/mtu3; cascades RZ_MTU3_CNT) ----
# CONFIG_PWM_RZG2L_GPT is not set
# CONFIG_PWM_RZ_MTU3 is not set
# CONFIG_RZ_MTU3 is not set

# ---- Peripheral SPI masters (no enabled node, pure size saving; keep SPI_RPCIF for xspi/NOR) ----
# CONFIG_SPI_RSPI is not set
# CONFIG_SPI_RSPI_V2H is not set
# CONFIG_SPI_SH_MSIOF is not set
# CONFIG_SPI_RZV2M_CSI is not set

# ---- Redundant thermal drivers (G3L tsu uses RZG3S_THERMAL; the others have no matching node) ----
# CONFIG_RZG2L_THERMAL is not set
# CONFIG_RCAR_THERMAL is not set
# CONFIG_RCAR_GEN3_THERMAL is not set

# ---- RTC driver (DT already disables rtc/vbattb; optional, keeping RTC_CLASS is fine) ----
# CONFIG_RTC_DRV_RENESAS_RTCA3 is not set

CONFIG_MEDIA_SUPPORT=y
CONFIG_VIDEO_DEV=y
CONFIG_V4L_PLATFORM_DRIVERS=y
CONFIG_VIDEO_RENESAS_VSP1=y
CONFIG_VIDEO_RENESAS_FCP=y
CONFIG_IIO=y
CONFIG_RZG2L_ADC=y
CONFIG_RZG3S_THERMAL=y
CONFIG_THERMAL=y
CONFIG_THERMAL_OF=y
CONFIG_DRM=y
CONFIG_DRM_RZG2L_DU=y
CONFIG_DRM_RZG2L_MIPI_DSI=y
CONFIG_DRM_I2C_ADV7511=y
CONFIG_FB=y
# Inherit the BSP's framebuffer-console and logo policy. A graphics overlay can
# disable those symbols without conflicting assignments in this base fragment.
CONFIG_SPI=y
CONFIG_SPI_RPCIF=y
CONFIG_MTD=y
CONFIG_MTD_SPI_NOR=y
CONFIG_MMC_SDHI=y
CONFIG_EXT4_FS=y
CONFIG_NET=y
CONFIG_SERIAL_SH_SCI=y
CONFIG_SERIAL_SH_SCI_CONSOLE=y

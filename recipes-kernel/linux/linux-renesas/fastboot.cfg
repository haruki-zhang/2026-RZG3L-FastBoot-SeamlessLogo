# ============================================================
# RZ/G3L (smarc-rzg3l / linux-renesas 6.12) fast-boot kernel config fragment
# ============================================================

# ---- Remove non-DT-gated boot work / shrink the Image ----
# CONFIG_BTRFS_FS is not set
# CONFIG_VIRTUALIZATION is not set
# CONFIG_EFI is not set
# CONFIG_NEW_LEDS is not set
# CONFIG_MODULE_UNLOAD is not set

# ---- PCIe (remove PCI subsystem init, relatively high value) ----
# CONFIG_PCI is not set

# ---- Ethernet (G3L GbE is actually STMMAC/dwmac; RAVB/SH_ETH/RSWITCH unused; keep NET core) ----
# CONFIG_STMMAC_ETH is not set
# CONFIG_NET_VENDOR_RENESAS is not set

# ---- CAN (cascades CAN_RCAR_CANFD and FLEXCAN/M_CAN/MCP251XFD) ----
# CONFIG_CAN is not set

# ---- Audio (cascades SND_SOC/RZ/PDM/DA7213/HDMI_CODEC/SIMPLE_CARD/AUDIO_GRAPH_CARD) ----
# CONFIG_SND is not set

# ---- Camera (disable only CRU/CSI2; keep MEDIA_SUPPORT/VSP1/FCP for display) ----
# CONFIG_VIDEO_RZG2L_CRU is not set
# CONFIG_VIDEO_RZG2L_CSI2 is not set

# ---- PWM / MTU3 (DT already disables gpt/poegd/mtu3; cascades RZ_MTU3_CNT) ----
# CONFIG_PWM_RZG2L_GPT is not set
# CONFIG_PWM_RZ_MTU3 is not set
# CONFIG_RZ_MTU3 is not set

# ---- Peripheral SPI masters (no enabled node, pure size saving; keep SPI_RPCIF for xspi/NOR) ----
# CONFIG_SPI_RSPI is not set
# CONFIG_SPI_RSPI_V2H is not set
# CONFIG_SPI_SH_MSIOF is not set
# CONFIG_SPI_RZV2M_CSI is not set

# ---- Redundant thermal drivers (G3L tsu uses RZG3S_THERMAL; the others have no matching node) ----
# CONFIG_RZG2L_THERMAL is not set
# CONFIG_RCAR_THERMAL is not set
# CONFIG_RCAR_GEN3_THERMAL is not set

# ---- RTC driver (DT already disables rtc/vbattb; optional, keeping RTC_CLASS is fine) ----
# CONFIG_RTC_DRV_RENESAS_RTCA3 is not set

# ============================================================
# Phase 2b: cut the number of device units systemd has to walk
# ============================================================
# Everything above trims boot *work*. This section trims the boot *unit count*,
# which turned out to dominate the critical path once phase 2 was in place.
#
# ---- Legacy BSD pseudo-terminals ----
# CONFIG_LEGACY_PTYS creates 256 pty pairs (/dev/ttyp0 .. /dev/ttyzf). udev
# emits an event for each one and systemd instantiates two device units per
# device - dev-ttyXX.device and sys-devices-virtual-tty-ttyXX.device - so 512
# units in total, 81% of every unit in the boot transaction.
#
# Measured on the EVK with `systemd-analyze plot` (x axis = kernel-relative):
#   2.883s .. 3.997s  systemd walks the 512 units serially -> 1114 ms
#   2.980s            systemd-user-sessions.service already finished
#   4.055s            multi-user.target
#   4.069s            weston.service starts
# i.e. a solid 1114 ms block sitting between "everything weston needs is ready"
# and "weston is allowed to start". It is also the bulk of the work in
# systemd-udev-trigger.service (1.049s) and the reason dev-mmcblk0p2.device
# takes until 2.757s to settle.
#
# CONFIG_UNIX98_PTYS (/dev/ptmx) is what all current userspace uses; nothing in
# this image opens a BSD-named pty. Asserted positively below so a defconfig
# change can never leave the board without any pty support at all.
# CONFIG_LEGACY_PTYS is not set

# ---- Wireless ----
# rz-vlp-fast drops wifi/bluetooth from DISTRO_FEATURES, but the kernel still
# builds cfg80211/mac80211 in - the boot log shows it loading the regulatory
# X.509 certificates and then failing on regulatory.db - and rfkill adds two
# more device units (dev-rfkill.device @4.000s). No userspace consumer is left.
# CONFIG_WIRELESS is not set
# CONFIG_RFKILL is not set

# ============================================================
# Phase 2b: entropy
# ============================================================
# systemd-random-seed.service blocks 998 ms inside sysinit.target waiting for
# the CRNG ("random: crng init done" at 2.590s). The rootfs half of the fix is
# a credited seed file - see fastboot-systemd-tweaks.bbclass - which covers
# every boot except the first one after flashing.
#
# This is the other half, and it covers the first boot too: once U-Boot
# publishes a seed in /chosen/rng-seed the kernel seeds the pool before
# userspace starts and the wait disappears entirely.
#
# NOTE: inert until the U-Boot side lands. It is enabled now so that the
# remaining work is confined to U-Boot, with no kernel change to remember.
CONFIG_RANDOM_TRUST_BOOTLOADER=y

# "KASLR disabled due to lack of seed" in every boot log: with no seed from the
# bootloader the randomisation never actually happens, so the relocation pass
# is pure cost. Note this stays off deliberately even after the U-Boot seed
# lands - re-enable it only if KASLR is a product requirement.
# CONFIG_RANDOMIZE_BASE is not set

CONFIG_UNIX98_PTYS=y
CONFIG_MEDIA_SUPPORT=y
CONFIG_VIDEO_DEV=y
CONFIG_V4L_PLATFORM_DRIVERS=y
CONFIG_VIDEO_RENESAS_VSP1=y
CONFIG_VIDEO_RENESAS_FCP=y
CONFIG_IIO=y
CONFIG_RZG2L_ADC=y
CONFIG_RZG3S_THERMAL=y
CONFIG_THERMAL=y
CONFIG_THERMAL_OF=y
CONFIG_DRM=y
CONFIG_DRM_RZG2L_DU=y
CONFIG_DRM_RZG2L_MIPI_DSI=y
CONFIG_DRM_I2C_ADV7511=y
CONFIG_FB=y
# Inherit the BSP's framebuffer-console and logo policy. A graphics overlay can
# disable those symbols without conflicting assignments in this base fragment.
CONFIG_SPI=y
CONFIG_SPI_RPCIF=y
CONFIG_MTD=y
CONFIG_MTD_SPI_NOR=y
CONFIG_MMC_SDHI=y
CONFIG_EXT4_FS=y
CONFIG_NET=y
CONFIG_SERIAL_SH_SCI=y
CONFIG_SERIAL_SH_SCI_CONSOLE=y

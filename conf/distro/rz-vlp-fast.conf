# SPDX-License-Identifier: MIT
#
# rz-vlp-fast - RZ/G3L phase-1/2 fast-boot distro
#
# Derived from rz-vlp. It applies device/kernel pruning and minimises userspace
# while retaining the BSP's Weston graphics stack.
#
# Serial console silencing and bootdelay are U-Boot environment settings, not
# distro policy. See this layer's README.

require conf/distro/rz-vlp.conf

DISTRO = "rz-vlp-fast"
DISTROOVERRIDES = "poky:rz-bsp:rz-vlp:rz-vlp-fast"

# The device-tree patch and config fragment target linux-renesas 6.12.
PREFERRED_VERSION_linux-renesas = "6.12%"

# Remove the RZ/VLP development, benchmark and test package groups.
FEATURE_PACKAGES_rz-vlp-tools = ""

DISTRO_FEATURES:remove = " bluetooth wifi 3g nfc nfs zeroconf alsa can pcmcia"
MACHINE_FEATURES:remove = " pci usbhost usbgadget alsa can"

# Do not autostart services for hardware and features removed above. These are
# also a defensive fallback if another dependency pulls a package back in.
SYSTEMD_AUTO_ENABLE:pn-connman        = "disable"
SYSTEMD_AUTO_ENABLE:pn-ofono          = "disable"
SYSTEMD_AUTO_ENABLE:pn-iptables       = "disable"
SYSTEMD_AUTO_ENABLE:pn-avahi          = "disable"
SYSTEMD_AUTO_ENABLE:pn-rpcbind        = "disable"
SYSTEMD_AUTO_ENABLE:pn-bluez5         = "disable"
SYSTEMD_AUTO_ENABLE:pn-neard          = "disable"
SYSTEMD_AUTO_ENABLE:pn-wpa-supplicant = "disable"
SYSTEMD_AUTO_ENABLE:pn-tcf-agent      = "disable"
SYSTEMD_AUTO_ENABLE:pn-watchdog       = "disable"
SYSTEMD_AUTO_ENABLE:pn-v4l2-init      = "disable"
SYSTEMD_AUTO_ENABLE:pn-audio-init     = "disable"

# smarc-rzg3l lacks SERIAL_CONSOLES, so systemd otherwise enables ttyS0.
SERIAL_CONSOLES = "115200;ttySC3"

# systemd's own resolved/networkd/timesyncd/userdbd have no separate recipe, so
# SYSTEMD_AUTO_ENABLE cannot reach them. They are masked in the rootfs instead -
# see FASTBOOT_MASKED_UNITS in fastboot-systemd-tweaks.bbclass and README VII.2.
IMAGE_CLASSES += "fastboot-systemd-tweaks"

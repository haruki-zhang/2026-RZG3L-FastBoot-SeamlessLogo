# Add this layer's conf directory to BBPATH.
BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-rzg3l-fast-logo-intro"
BBFILE_PATTERN_meta-rzg3l-fast-logo-intro = "^${LAYERDIR}/"

# Apply after the Renesas BSP layers, whose u-boot and linux-renesas recipes
# this layer appends.
BBFILE_PRIORITY_meta-rzg3l-fast-logo-intro = "20"

LAYERDEPENDS_meta-rzg3l-fast-logo-intro = "core meta-rz-bsp"

LAYERSERIES_COMPAT_meta-rzg3l-fast-logo-intro = "scarthgap"

# ---------------------------------------------------------------------------
# User interface
# ---------------------------------------------------------------------------
# Everything below can be overridden from local.conf. See README section IV.

# Output resolution. U-Boot drives HDMI at exactly this mode, from a timing
# table compiled into its display driver, and the artwork must be drawn at
# the same size. The kernel follows automatically: U-Boot tells it the mode at
# boot, so the kernel image does not depend on this.
#
# Tables exist for 1920x1080 and 1280x720. Adding one is a new define_*.h in
# the U-Boot display driver - see README section IV.
RZG3L_FASTLOGO_RESOLUTION ?= "1920x1080"

# The frames U-Boot plays, in order. Each entry is either a file name found in
# this layer's (or a bbappend's) files/ directory, or an absolute path on the
# build host. How many frames there are is simply how many are listed; U-Boot
# plays whatever is installed.
RZG3L_FASTLOGO_FRAMES ?= "l1.bmp l2.bmp l3.bmp l4.bmp"

# Default time each frame stays on screen, compiled into U-Boot. The
# "logo_rate_ms" U-Boot environment variable overrides it at run time.
RZG3L_FASTLOGO_RATE_MS ?= "1000"

# The frame files have to be in the image for U-Boot to find them. Set this to
# "" to build an image without them - U-Boot then scans out a black frame and
# the hand-over to the kernel still takes place.
RZG3L_FASTLOGO_PACKAGE ?= "rzg3l-fastlogo-frames"
IMAGE_INSTALL:append:smarc-rzg3l = " ${RZG3L_FASTLOGO_PACKAGE}"

# No boot splash on top of the boot logo. psplash draws on /dev/fb0 from early
# userspace, which would replace the logo. On smarc-rzg3l it is not installed
# today - SPLASH is only "psplash" when MACHINE_FEATURES has "screen" - and
# without DRM fbdev emulation it could not draw anyway, but a machine or distro
# change should not be able to bring it back unnoticed.
IMAGE_FEATURES:remove:smarc-rzg3l = "splash"

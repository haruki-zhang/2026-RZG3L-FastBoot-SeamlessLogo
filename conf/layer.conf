BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-rzg3l-fast-logo"
BBFILE_PATTERN_meta-rzg3l-fast-logo = "^${LAYERDIR}/"

# Apply after the Renesas BSP layers, whose u-boot and linux-renesas recipes
# this layer appends. Same priority as meta-rzg3l-fast-boot-base, which this
# layer neither requires nor conflicts with.
BBFILE_PRIORITY_meta-rzg3l-fast-logo = "20"

LAYERDEPENDS_meta-rzg3l-fast-logo = "core meta-rz-bsp"
LAYERSERIES_COMPAT_meta-rzg3l-fast-logo = "scarthgap"

# U-Boot reads the splash from /boot on the rootfs partition, so the payload has
# to be in the image for the layer to do anything useful. Adding it here rather
# than in a distro conf keeps a plain "bitbake-layers add-layer" sufficient.
#
# Note this applies to every image built in the project. To build one without
# the payload - a recovery initramfs, say - set
#
#   RZG3L_BOOT_LOGO_PACKAGE = ""
#
# in local.conf. U-Boot then prints "fast-logo: no splash image, showing a blank
# screen", brings the pipeline up on a blanked frame buffer, and the hand-over
# to the kernel still works.
RZG3L_BOOT_LOGO_PACKAGE ?= "rzg3l-boot-logo"
IMAGE_INSTALL:append = " ${RZG3L_BOOT_LOGO_PACKAGE}"

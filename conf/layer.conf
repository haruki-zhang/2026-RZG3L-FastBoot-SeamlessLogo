# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-rzg3l-fast-logo"
BBFILE_PATTERN_meta-rzg3l-fast-logo = "^${LAYERDIR}/"

# Apply after the Renesas BSP layers, whose u-boot and linux-renesas recipes
# this layer appends. Same priority as meta-rzg3l-fast-boot-base.
BBFILE_PRIORITY_meta-rzg3l-fast-logo = "20"

LAYERDEPENDS_meta-rzg3l-fast-logo = "core meta-rz-bsp"
LAYERSERIES_COMPAT_meta-rzg3l-fast-logo = "scarthgap"

# The U-Boot fast-logo driver loads its splash from /boot on the rootfs
# partition, so the payload has to be in the image for the layer to do anything
# useful. Adding it here rather than in a distro conf keeps the layer usable
# with a plain "bitbake-layers add-layer" plus any image recipe.
#
# To build an image without the payload - a recovery initramfs, say - set
#
#   RZG3L_BOOT_LOGO_PACKAGE = ""
#
# in local.conf. U-Boot then prints "fast-logo: no splash image, showing a
# blank screen", brings the pipeline up on a blanked frame buffer, and the
# hand-over to the kernel still works.
RZG3L_BOOT_LOGO_PACKAGE ?= "rzg3l-boot-logo"
IMAGE_INSTALL:append = " ${RZG3L_BOOT_LOGO_PACKAGE}"

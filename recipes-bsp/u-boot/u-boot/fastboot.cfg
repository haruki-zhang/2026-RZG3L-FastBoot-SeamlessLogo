# ============================================================
# RZ/G3L (smarc-rzg3l / u-boot 2024.07) fast-boot config fragment
# ============================================================
#
# Merged over smarc-rzg3l_defconfig by u-boot-configure.inc (merge_config.sh
# followed by "make oldconfig"), so this fragment wins over the defconfig.
#
# Only Kconfig-visible settings belong here. The rest of the fast-boot
# environment lives in CFG_EXTRA_ENV_SETTINGS / CONFIG_BOOTCOMMAND inside
# include/configs/smarc-rzg3l.h and is changed by 0001-*.patch.

# ---- Autoboot with no countdown ----
# Kconfig defaults BOOTDELAY to 2, and env_default.h turns it into the
# "bootdelay" environment variable, so the stock board waits two seconds for a
# keypress on every boot. 0 means boot immediately but still test for a
# pending character, which keeps the "hit any key" escape hatch on the serial
# console. Use -2 to drop even that test; there is no measurable gain.
CONFIG_BOOTDELAY=0

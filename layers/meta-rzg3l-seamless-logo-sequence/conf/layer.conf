BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-rzg3l-seamless-logo-sequence"
BBFILE_PATTERN_meta-rzg3l-seamless-logo-sequence = "^${LAYERDIR}/"

# Higher than the Renesas layers, so these bbappends apply last.
BBFILE_PRIORITY_meta-rzg3l-seamless-logo-sequence = "20"

LAYERDEPENDS_meta-rzg3l-seamless-logo-sequence = "core meta-rz-bsp"

LAYERSERIES_COMPAT_meta-rzg3l-seamless-logo-sequence = "scarthgap"

# The settings below can be changed in local.conf. See the guide, section 4.3.

# Output mode, compiled into U-Boot. The frames must have the same size. The
# kernel needs no change: U-Boot passes the mode at boot.
# U-Boot has tables for 1920x1080 and 1280x720. To add one, see README
# section III.
RZG3L_LOGO_SEQUENCE_RESOLUTION ?= "1920x1080"

# Frames in play order: file names in files/, or absolute paths on the build
# host. U-Boot plays all installed frames, so the list sets the count.
RZG3L_LOGO_SEQUENCE_FRAMES ?= "l1.bmp l2.bmp l3.bmp l4.bmp"

# Time per frame in ms, compiled into U-Boot. "logo_rate_ms" in the U-Boot
# environment overrides it.
RZG3L_LOGO_SEQUENCE_RATE_MS ?= "1000"

# U-Boot loads the frames from /boot on the rootfs. Set "" for an image
# without frames. U-Boot then shows a black frame, and the hand-over to the
# kernel still works.
RZG3L_LOGO_SEQUENCE_PACKAGE ?= "rzg3l-seamless-logo-sequence-frames"
IMAGE_INSTALL:append:smarc-rzg3l = " ${RZG3L_LOGO_SEQUENCE_PACKAGE}"

# psplash would draw over the logo. It is not installed today, and without
# fbdev emulation it cannot draw. Removing "splash" keeps a later machine or
# distro change from bringing it back.
IMAGE_FEATURES:remove:smarc-rzg3l = "splash"

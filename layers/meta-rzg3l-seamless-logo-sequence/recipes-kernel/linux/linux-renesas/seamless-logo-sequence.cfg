# The first DRM commit replaces the U-Boot logo. Nothing in the kernel may
# commit before the logo application or the compositor. Three parts would:
#
# The framebuffer console commits a black frame from the DU probe. It also
# draws the kernel logo.
#
# DRM fbdev emulation, even without the console. Its connector probe raises a
# hotplug event about 4 s into boot, and fbdev answers it with a blank commit.
# Closing the last DRM file before the compositor starts does the same. There
# is no /dev/fb0 without it; applications must use DRM/KMS.
#
# The VT console has nothing to draw on without the two above. It is turned
# off because the PM core switches VT on suspend, and that switch can hang
# against a compositor that owns the VT. It needs the expert options. Kernel
# messages still go to the serial console.
#
# Do not name a symbol set below in these comments. merge_config.sh greps the
# whole file and reports a false "value is redefined".

# CONFIG_FRAMEBUFFER_CONSOLE is not set
# CONFIG_FRAMEBUFFER_CONSOLE_DETECT_PRIMARY is not set
# CONFIG_LOGO is not set
# CONFIG_LOGO_LINUX_CLUT224 is not set
# CONFIG_DRM_FBDEV_EMULATION is not set
CONFIG_EXPERT=y
# CONFIG_VT_CONSOLE is not set

# Built in, not modules. A module probes after userspace has started, when
# something else may already have touched the display.
CONFIG_DRM=y
CONFIG_DRM_RZG2L_DU=y
CONFIG_DRM_RZG2L_MIPI_DSI=y
CONFIG_DRM_I2C_ADV7511=y
CONFIG_VIDEO_RENESAS_VSP1=y

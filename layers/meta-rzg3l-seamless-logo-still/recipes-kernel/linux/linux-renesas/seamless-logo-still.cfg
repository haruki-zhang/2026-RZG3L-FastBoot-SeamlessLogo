# RZ/G3L seamless boot logo - kernel configuration
#
# The hand-over is one-shot: the DU, DSI, VSP and ADV7535 drivers each skip
# their destructive setup for exactly one modeset and behave normally
# afterwards. That only produces a seamless boot if the first DRM commit is the
# one carrying real content, i.e. the compositor's.
#
# The BSP defconfig leaves the framebuffer console enabled, and fbcon reaches
# drm_fb_helper_set_par() from rzg2l_du_probe(). That commit paints black over
# the picture U-Boot left on screen *and* consumes all four one-shot guards
# before the compositor ever runs, so the logo is lost no matter what the rest
# of this layer does.
#
# Dropping fbdev emulation removes that first commit entirely: with no fbcon,
# nobody calls set_par(). It also frees the framebuffer fbcon would otherwise
# pin in CMA for the lifetime of the system. Weston's DRM backend does not use
# /dev/fb0 and core-image-weston pulls in no other fbdev client, so nothing in
# the image regresses.
#
# If you add a component that needs /dev/fb0, re-enable fbdev emulation but
# leave the framebuffer console off - fbcon is the part that issues the modeset.
#
# CONFIG_FB itself is left exactly as the BSP has it. Turning it off is an
# image-size optimisation that first needs a check that no enabled driver
# selects it.
#
# Do not spell out a symbol assigned below in the prose above: merge_config.sh
# resolves each symbol with "grep -w" over the whole fragment, so a comment
# mentioning one makes it report a bogus "value is redefined".

# CONFIG_DRM_FBDEV_EMULATION is not set
# CONFIG_FRAMEBUFFER_CONSOLE is not set
# CONFIG_FRAMEBUFFER_CONSOLE_DETECT_PRIMARY is not set

# The kernel logo is drawn by fbcon, and it would be drawn over the U-Boot
# picture.
# CONFIG_LOGO is not set
# CONFIG_LOGO_LINUX_CLUT224 is not set

# RZ/G3L (smarc-rzg3l, u-boot 2024.07) fast-boot config fragment.
#
# Merged over smarc-rzg3l_defconfig by u-boot.inc (merge_config.sh then
# "make oldconfig"), so this fragment wins over the defconfig. Only
# Kconfig-visible settings belong here; the rest of the fast-boot environment
# lives in include/configs/smarc-rzg3l.h and is changed by 0001-*.patch.

# Autoboot with no countdown. Kconfig defaults this to 2 and env_default.h
# turns it into the "bootdelay" variable, so the stock board waits two seconds
# on every boot. 0 boots immediately but still tests for a pending character,
# keeping the "hit any key" escape hatch on the serial console. Use -2 to drop
# even that test; there is no measurable gain.
CONFIG_BOOTDELAY=0

# Add this layer's conf and classes directories to BBPATH.
BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-rzg3l-fast-boot-base"
BBFILE_PATTERN_meta-rzg3l-fast-boot-base = "^${LAYERDIR}/"

# Apply after the Renesas BSP, distro and graphics layers.
BBFILE_PRIORITY_meta-rzg3l-fast-boot-base = "20"

# meta-rz-graphics is required because the phase-2 Weston service optimisation
# intentionally overrides its weston-init bbappend.
LAYERDEPENDS_meta-rzg3l-fast-boot-base = "core meta-rz-bsp meta-rz-distro meta-rz-graphics"

LAYERSERIES_COMPAT_meta-rzg3l-fast-boot-base = "scarthgap"

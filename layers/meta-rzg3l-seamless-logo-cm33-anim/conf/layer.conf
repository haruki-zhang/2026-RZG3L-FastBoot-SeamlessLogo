BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-rzg3l-seamless-logo-cm33-anim"
BBFILE_PATTERN_meta-rzg3l-seamless-logo-cm33-anim = "^${LAYERDIR}/"

# Above meta-rzg3l-seamless-logo-still (20), below meta-rzg3l-lp-display
# (30).
BBFILE_PRIORITY_meta-rzg3l-seamless-logo-cm33-anim = "25"

#   rz-multi-os                     BL2 starts the CM33 firmware
#   meta-rzg3l-seamless-logo-still  U-Boot display driver and kernel takeover
#   arm-toolchain                   compiler for the CM33 firmware
LAYERDEPENDS_meta-rzg3l-seamless-logo-cm33-anim = "core meta-rz-bsp rz-multi-os meta-rzg3l-seamless-logo-still arm-toolchain"

LAYERSERIES_COMPAT_meta-rzg3l-seamless-logo-cm33-anim = "scarthgap"

# meta-rz-multi-os ships this commented out. Enabling it here keeps the
# Multi-OS package unchanged.
MACHINE_FEATURES:append = " RZ_CM33_FIRMWARE_LOAD"

# BL2 loads only one CM33 firmware. With meta-rzg3l-lp-display, the
# animation is linked into the demo firmware.
BBFILES_DYNAMIC += " \
    meta-rzg3l-lp-display:${LAYERDIR}/dynamic-layers/meta-rzg3l-lp-display/*/*/*.bbappend \
"

# Shared by fla-cm33-fw, the lpdemo-cm33-fw bbappend and U-Boot (fla_mailbox.h).
FLA_FW_FILESDIR := "${LAYERDIR}/recipes-firmware/fla-cm33-fw/files"

# The CM33 firmware written to the boot media.
RZG3L_CM33_FW ?= "${@'lpdemo-cm33-fw' if 'meta-rzg3l-lp-display' in (d.getVar('BBFILE_COLLECTIONS') or '').split() else 'fla-cm33-fw'}"

IMAGE_CLASSES += "fla-cm33-fw-image"

# Set here, not in the recipes, because both the frames recipe and U-Boot use
# them. U-Boot needs the size and position at build time: it builds the Layer1
# display list before the VSPD starts.
#   FLA_ANIM_SIZE       <width>x<height>
#   FLA_ANIM_PERIOD_MS  time per frame. The spinner steps one dot per frame.
#   FLA_ANIM_LOOP       1: loop until Linux takes over the display
#   FLA_ANIM_Y          vertical centre, in 1/1000 of the screen height. 800 is
#                       below the wordmark of the still logo, at 720p and
#                       1080p.
# Default: a 12-dot spinner with a percentage inside, one turn in 1.5 s. The
# time from 1 % to 99 % is FLA_ANIM_PROGRESS_S in the frames recipe.
FLA_ANIM_SIZE ?= "192x192"
FLA_ANIM_PERIOD_MS ?= "125"
FLA_ANIM_LOOP ?= "1"
FLA_ANIM_Y ?= "800"

# "": no frames in the rootfs. U-Boot then shows the still logo only.
FLA_ANIM_PACKAGE ?= "rzg3l-seamless-logo-cm33-anim-frames"
IMAGE_INSTALL:append = " ${FLA_ANIM_PACKAGE}"

# The "is not set" entries remove boot work. The "=y" entries at the end keep
# the display and the boot storage, even if the defconfig changes.
#
# Do not write a symbol of this file in a comment. merge_config.sh greps the
# whole fragment and then reports a false "value is redefined".

# ---- Init work and image size, no device-tree node needed ----
# CONFIG_BTRFS_FS is not set
# CONFIG_VIRTUALIZATION is not set
# CONFIG_EFI is not set
# CONFIG_NEW_LEDS is not set
# CONFIG_MODULE_UNLOAD is not set

# ---- PCIe ----
# CONFIG_PCI is not set

# ---- Ethernet (the G3L GbE is a dwmac; no Renesas MAC on this SoC) ----
# CONFIG_STMMAC_ETH is not set
# CONFIG_NET_VENDOR_RENESAS is not set

# ---- CAN, audio, camera (also removes their subsystems) ----
# CONFIG_CAN is not set
# CONFIG_SND is not set
# CONFIG_VIDEO_RZG2L_CRU is not set
# CONFIG_VIDEO_RZG2L_CSI2 is not set

# ---- PWM / MTU3 ----
# CONFIG_PWM_RZG2L_GPT is not set
# CONFIG_PWM_RZ_MTU3 is not set
# CONFIG_RZ_MTU3 is not set

# ---- SPI masters without an enabled node (RPCIF for the NOR is kept) ----
# CONFIG_SPI_RSPI is not set
# CONFIG_SPI_RSPI_V2H is not set
# CONFIG_SPI_SH_MSIOF is not set
# CONFIG_SPI_RZV2M_CSI is not set

# ---- Thermal drivers for other SoCs (the G3L uses the RZ/G3S driver) ----
# CONFIG_RZG2L_THERMAL is not set
# CONFIG_RCAR_THERMAL is not set
# CONFIG_RCAR_GEN3_THERMAL is not set

# ---- RTC (disabled in the device tree) ----
# CONFIG_RTC_DRV_RENESAS_RTCA3 is not set

# ---- Legacy BSD pseudo-terminals ----
# They create 512 systemd device units that nothing opens. systemd handles
# them one by one for about 1.1 s before Weston can start. Current userspace
# uses the UNIX98 interface below.
# CONFIG_LEGACY_PTYS is not set

# ---- Wireless ----
# The DISTRO_FEATURES change does not remove cfg80211/mac80211 from the
# kernel, and rfkill adds two device units. WLAN (default y) selects
# WIRELESS, so WLAN must be disabled too.
# CONFIG_WLAN is not set
# CONFIG_WIRELESS is not set
# CONFIG_RFKILL is not set

# ---- KASLR ----
# U-Boot passes no seed, so KASLR is disabled at every boot anyway and the
# relocation only costs time. Re-enable it together with /chosen/rng-seed.
# CONFIG_RANDOMIZE_BASE is not set

# ---- Must survive ----
CONFIG_UNIX98_PTYS=y
CONFIG_MEDIA_SUPPORT=y
CONFIG_VIDEO_DEV=y
CONFIG_V4L_PLATFORM_DRIVERS=y
CONFIG_VIDEO_RENESAS_VSP1=y
CONFIG_VIDEO_RENESAS_FCP=y
CONFIG_IIO=y
CONFIG_RZG2L_ADC=y
CONFIG_RZG3S_THERMAL=y
CONFIG_THERMAL=y
CONFIG_THERMAL_OF=y
CONFIG_DRM=y
CONFIG_DRM_RZG2L_DU=y
CONFIG_DRM_RZG2L_MIPI_DSI=y
CONFIG_DRM_I2C_ADV7511=y
CONFIG_SPI=y
CONFIG_SPI_RPCIF=y
CONFIG_MTD=y
CONFIG_MTD_SPI_NOR=y
CONFIG_MMC_SDHI=y
CONFIG_EXT4_FS=y
CONFIG_NET=y
CONFIG_SERIAL_SH_SCI=y
CONFIG_SERIAL_SH_SCI_CONSOLE=y

# Same value as the BSP. The logo layers turn the framebuffer console and the
# kernel logo off, so this fragment must not set those.
CONFIG_FB=y

BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-rzg3l-fast-boot"
BBFILE_PATTERN_meta-rzg3l-fast-boot = "^${LAYERDIR}/"

# Higher than the Renesas layers, so these bbappends apply last.
BBFILE_PRIORITY_meta-rzg3l-fast-boot = "20"

# meta-rz-graphics: weston-init.bbappend changes the weston.service it ships.
LAYERDEPENDS_meta-rzg3l-fast-boot = "core meta-rz-bsp meta-rz-distro meta-rz-graphics"

LAYERSERIES_COMPAT_meta-rzg3l-fast-boot = "scarthgap"

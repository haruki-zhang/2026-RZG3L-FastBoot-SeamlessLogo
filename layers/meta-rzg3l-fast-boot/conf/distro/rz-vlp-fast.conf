# SPDX-License-Identifier: MIT
#
# rz-vlp-fast: rz-vlp without the features and services a fast-booting
# Weston product does not use.
#
# bootdelay and the quiet console are U-Boot settings, so they are in the
# u-boot bbappend.

require conf/distro/rz-vlp.conf

DISTRO = "rz-vlp-fast"
DISTROOVERRIDES = "poky:rz-bsp:rz-vlp:rz-vlp-fast"

# The device-tree patch and fastboot.cfg are written for 6.12.
PREFERRED_VERSION_linux-renesas = "6.12%"

# Development, benchmark and test tools.
FEATURE_PACKAGES_rz-vlp-tools = ""

DISTRO_FEATURES:remove = " bluetooth wifi 3g nfc nfs zeroconf alsa can pcmcia"
MACHINE_FEATURES:remove = " pci usbhost usbgadget alsa can"

# In case a dependency pulls one of these packages back in.
SYSTEMD_AUTO_ENABLE:pn-connman        = "disable"
SYSTEMD_AUTO_ENABLE:pn-ofono          = "disable"
SYSTEMD_AUTO_ENABLE:pn-iptables       = "disable"
SYSTEMD_AUTO_ENABLE:pn-avahi          = "disable"
SYSTEMD_AUTO_ENABLE:pn-rpcbind        = "disable"
SYSTEMD_AUTO_ENABLE:pn-bluez5         = "disable"
SYSTEMD_AUTO_ENABLE:pn-neard          = "disable"
SYSTEMD_AUTO_ENABLE:pn-wpa-supplicant = "disable"
SYSTEMD_AUTO_ENABLE:pn-tcf-agent      = "disable"
SYSTEMD_AUTO_ENABLE:pn-watchdog       = "disable"
SYSTEMD_AUTO_ENABLE:pn-v4l2-init      = "disable"
SYSTEMD_AUTO_ENABLE:pn-audio-init     = "disable"

# smarc-rzg3l sets no SERIAL_CONSOLES, so a getty would start on ttyS0.
SERIAL_CONSOLES = "115200;ttySC3"

# For the systemd units that SYSTEMD_AUTO_ENABLE cannot reach.
IMAGE_CLASSES += "fastboot-systemd-tweaks"

# RZ/G3L boot logo - kernel configuration
#
# While the hand-over is pending, the first DRM commit - whoever makes it -
# replaces the picture U-Boot left on screen. So nothing in the kernel may
# commit before the compositor or the boot logo application does. Three
# in-kernel parts would:
#
# The framebuffer console. It commits an all-black framebuffer from the DU
# driver's probe. The kernel logo is drawn by that console, so it goes too.
#
# DRM fbdev emulation, even without the console. Its initial configuration
# probes the HDMI connector, which changes the connector status from unknown
# to connected; the probe helper turns that into a hotplug event, and fbdev
# answers the event with set_par(), committing its own blank framebuffer while
# no DRM master exists yet - about four seconds into boot. Closing the last DRM
# file descriptor before the compositor would do the same through the fbdev
# restore. Without fbdev emulation there is no /dev/fb0; applications must use
# DRM/KMS.
#
# The console on the virtual terminal. With neither of the above it has nothing
# to draw on, but turning it off also removes the VT switch the PM core makes
# on suspend, the one that can deadlock against a compositor that owns the VT.
# That switch is why fbdev emulation was once kept on for suspend's sake; with
# no VT console there is no switch. It is only configurable with the expert
# options visible. Kernel messages still go to the serial console.
#
# Do not spell out a symbol assigned below in the prose above: merge_config.sh
# resolves each symbol with "grep -w" over the whole fragment, so a comment
# mentioning one makes it report a bogus "value is redefined".

# CONFIG_FRAMEBUFFER_CONSOLE is not set
# CONFIG_FRAMEBUFFER_CONSOLE_DETECT_PRIMARY is not set
# CONFIG_LOGO is not set
# CONFIG_LOGO_LINUX_CLUT224 is not set
# CONFIG_DRM_FBDEV_EMULATION is not set
CONFIG_EXPERT=y
# CONFIG_VT_CONSOLE is not set

# ---- Must survive ----
# Asserted positively so a defconfig change cannot quietly turn one of the
# drivers on the hand-over path into a module, which would probe after
# userspace has started and after something else has touched the display.
CONFIG_DRM=y
CONFIG_DRM_RZG2L_DU=y
CONFIG_DRM_RZG2L_MIPI_DSI=y
CONFIG_DRM_I2C_ADV7511=y
CONFIG_VIDEO_RENESAS_VSP1=y
